<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2367c707%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M20 4C9 4 4 9 4 16c0 2 .6 3.4 1 4 .6-.4 2-1 4-1 7 0 11-5 11-15z%27/%3E%3Cpath d=%27M4 20c3-6 6-9 11-12%27/%3E%3C/svg%3E"><title>இயற்கை · iyarkai</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#fff;--ink:#143516;--mut:#5d7255;--g:#2a8a0c;--g2:#e9f8d3;--y2:#fff2c2;--gold:#f8b70e;--leaf:#67c707;--onp:#0e3a10;--bd:#f2e7b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Tamil",sans-serif}
.app{max-width:440px;margin:auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0}h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.08em}
.logo{height:58px;background:#fff;border-radius:14px;padding:4px 8px;border:1px solid var(--bd)}.top{padding-bottom:10px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sync{font-size:11px;color:var(--mut);text-align:right}
input,select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:15px}
.ban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:12px 0;border-radius:20px}
.ban>div{flex:0 0 100%;scroll-snap-align:center;height:140px;border-radius:20px;background:linear-gradient(135deg,#67c707,#f8b70e);color:#0e3a10;display:flex;align-items:flex-end;padding:16px;font-weight:700;font-size:18px;background-size:cover;background-position:center}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--ink);white-space:nowrap;font-size:14px}
.chip.on{background:var(--leaf);color:var(--onp);border-color:var(--leaf);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:20px;padding:10px;border:1px solid var(--bd);box-shadow:0 6px 16px #f8b70e22}
.img{height:104px;border-radius:14px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.img{position:relative}.gw{position:relative}.cnt{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:11px;padding:2px 9px;border-radius:99px}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th button{flex:none;width:54px;height:54px;padding:0;border-radius:12px;border:2px solid var(--bd);overflow:hidden;background:var(--g2)}.th button.on{border-color:var(--leaf)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.img svg{width:46%;height:46%;color:var(--g)}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal .img{flex:0 0 100%;height:180px;scroll-snap-align:center}
.img img{width:100%;height:100%;object-fit:cover}
.card b{display:block;margin:8px 0 2px;font-size:14px}.mut{color:var(--mut);font-size:12px}
.pr{color:var(--g);font-weight:700;font-size:15px}
.out{opacity:.55}
.btn{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-decoration:none;display:block;text-align:center}
.pri{background:linear-gradient(180deg,var(--leaf),#52b004);color:var(--onp);font-weight:700;box-shadow:0 4px 12px #67c70744}.sec{background:var(--y2);color:var(--ink);border:1px solid var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav>div{max-width:416px;width:100%;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:0 8px 24px #00000022}
.nav button{flex:1;border:0;background:none;padding:8px;border-radius:18px;color:var(--mut);font-size:12px}
.nav button.on{background:var(--y2);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sh{background:var(--bg);width:100%;max-width:440px;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.q{display:flex;align-items:center;gap:14px}.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:20px}
.big{font-size:26px;font-weight:800;color:var(--g)}
.wl{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;margin-bottom:10px}
.wl .img{width:64px;height:64px;font-size:30px;flex:none}.wl>div:nth-child(2){flex:1}
.x{background:none;border:0;color:var(--mut);font-size:20px}
label{font-size:13px;color:var(--mut)}
</style></head><body><div class="app" id="app"></div><div id="ov"><div id="sh"></div></div><div class="nav"><div id="nav"></div></div>

 if(!force&&Date.now()-S.last<6e5)return;

 await pull(CFG.CONFIG_URL,j=>{if(!j||typeof j!=="object")throw 0;S.cfg=j;sv("cfg",j)});
 if(ok){S.last=Date.now();sv("last",S.last)}
 render();
}

 if(tab==="home"){
  const cats=["All",...new Set(S.stock.map(p=>p.cat||"Other"))];
  const list=S.stock.map((p,i)=>({p,i})).filter(({p})=>(cat==="All"||(p.cat||"Other")===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  $("#app").innerHTML=head+`<input id="s" placeholder="Search products…" value="${q}" oninput="q=this.value;render();var s=$('#s');s.focus();s.setSelectionRange(q.length,q.length)">
  <div class="ban">${S.ban.map(b=>/^https?:/.test(b)?`<div style="background-image:url(${b})"></div>`:`<div>${b}</div>`).join("")}</div>
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div>

  (S.enq.length?"<h3>Enquired</h3>"+S.enq.slice().reverse().map(e=>`<div class="wl"><div><b>${e.name}</b><div class="mut">${e.qty} ${e.unit} · ${inr(e.total)} · ${new Date(e.at).toLocaleDateString()}</div></div></div>`).join(""):"");

function openP(i,pq){
 cur=S.stock[i];if(!cur)return;qty=pq||step(cur);gi=0;
 if(cur.stock_quantity<=0){openSheet(`<h2>${cur.name}</h2><p class="mut">Currently out of stock.</p><button class="btn sec" onclick="closeSheet()">Close</button>`);return}
 drawP();
}
let gi=0;
const gal=p=>{const im=p.image||[];if(!im.length)return `<div class="img" style="height:170px">${ph(p)}</div>`;
 const t=u=>`<img src="${u}" alt="" data-c="${p.cat||""}" onerror="fb(this)">`;
 return `<div class="gw"><div class="gal" onscroll="gs(this)">${im.map(u=>`<div class="img">${t(u)}</div>`).join("")}</div>${im.length>1?`<span class="cnt" id="cnt">1/${im.length}</span>`:""}</div>`+(im.length>1?`<div class="th">${im.map((u,i)=>`<button class="${i?"":"on"}" onclick="gt(${i})"><img src="${u}" alt="" onerror="this.style.visibility='hidden'"></button>`).join("")}</div>`:"")};
const gs=g=>{const w=g.clientWidth||1,i=Math.min(g.children.length-1,Math.round(g.scrollLeft/w));gi=i;const c=$("#cnt");if(c)c.textContent=(i+1)+"/"+g.children.length;document.querySelectorAll(".th button").forEach((b,k)=>b.classList.toggle("on",k===i))};
const gt=i=>{const g=$(".gal");if(g)g.scrollTo({left:i*g.clientWidth,behavior:"smooth"})};
function drawP(){
 const p=cur,t=p.min_quantity_price*qty;
 openSheet(`${gal(p)}
 <div class="row"><h2 style="margin:0">${p.name}</h2><span class="mut">${p.cat||""}</span></div>
 <div class="mut">${inr(p.min_quantity_price)} per ${p.quantity_type==="kg"?"kg":"piece"} · ${p.stock_quantity} ${unit(p)} available</div>
 <div class="row"><div class="q"><button onclick="chg(-1)">−</button><b>${qty} ${unit(p)}</b><button onclick="chg(1)">+</button></div><div class="big">${inr(t)}</div></div>
 <div class="row" style="margin-top:20px"><button class="btn sec" onclick="askAddr('wish')">${ic('heart',18)} Wishlist</button><button class="btn pri" onclick="askAddr('enq')">${ic('send',18)} Enquire</button></div>`);
 const g=$(".gal");if(g){g.scrollLeft=gi*g.clientWidth;gs(g)}
}
function chg(d){const n=qty+d*step(cur);if(n>=step(cur)&&n<=cur.stock_quantity){qty=n;drawP()}}
function askAddr(mode){
 if(mode==="wish"){saveItem("wish");return}
 if(S.addr)openSheet(`<h3>Use this address?</h3><p>${esc(S.addr)}</p><div class="row"><button class="btn sec" onclick="newAddr()">New address</button><button class="btn pri" onclick="finish()">Use this</button></div>`);
 else newAddr();
}
function newAddr(){openSheet(`<h3>Delivery address</h3><input id="na" placeholder="Door no, street, city, pincode"><div class="row"><button class="btn pri" onclick="var v=$('#na').value.trim();if(v){S.addr=v;sv('addr',v);finish()}">Save &amp; continue</button></div>`)}
function saveItem(k){
 const it={name:cur.name,qty,unit:unit(cur),total:cur.min_quantity_price*qty,at:Date.now()};
 if(k==="wish"){S.wish=S.wish.filter(w=>w.name!==it.name);S.wish.push(it);sv("wish",S.wish);render();openSheet(`<h3>${ic('check')} Added to wishlist</h3><button class="btn pri" onclick="closeSheet()">OK</button>`)}
 else{S.enq.push(it);sv("enq",S.enq)}
}
function finish(){
 saveItem("enq");
 const v={product_name:cur.name,quantity:qty+" "+unit(cur),location:S.addr,total:inr(cur.min_quantity_price*qty),customer_number:S.phone||""};
 const msg=(S.cfg.message_template||DEF_TPL).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
 const nums=(S.cfg.whatsapp_numbers||[]).map(n=>String(n).replace(/[^0-9]/g,"")).filter(Boolean);
 const links=nums.map(n=>`<a class="btn pri" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}">Send on WhatsApp · +${n}</a>`).join("");
 openSheet(`<h3>Send enquiry</h3><p class="mut">${esc(msg)}</p><p><b>Total: ${inr(cur.min_quantity_price*qty)}</b></p>${links||'<p>Shop WhatsApp number is not set up yet.</p>'}<button class="btn sec" style="margin-top:10px" onclick="closeSheet();render()">Done</button>`);
}
render();sync(true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
setInterval(()=>sync(true),864e5);
</script></body></html>
